<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js ar - camera access</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link type="text/css" rel="stylesheet" href="main.css">
	<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
  }
}
</script>

</head>

<body>

	<div id="info">
		<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> ar - camera access<br />
	</div>

	<script type="module">

		import * as THREE from 'three';
		import { ARButton } from 'three/addons/webxr/ARButton.js';
		import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
		import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

		const clock = new THREE.Clock();

		let camera, scene, renderer;
		let model;

		init();

		async function init() {

			// --------------------------------
			// CONTAINER, CAMERA, SCENE
			// --------------------------------

			const container = document.createElement('div');
			document.body.appendChild(container);

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera(
				70,
				window.innerWidth / window.innerHeight,
				0.01,
				20
			);

			// --------------------------------
			// RENDERER
			// --------------------------------

			renderer = new THREE.WebGLRenderer({
				antialias: true,
				alpha: true
			});

			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);

			renderer.outputColorSpace = THREE.SRGBColorSpace;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = 1.3;

			renderer.xr.enabled = true;

			container.appendChild(renderer.domElement);

			renderer.setAnimationLoop(animate);

			// --------------------------------
			// AR BUTTON
			// --------------------------------

			document.body.appendChild(
				ARButton.createButton(renderer, {
					requiredFeatures: ['camera-access']
				})
			);

			// --------------------------------
			// LOAD RUBIK OBJECT
			// --------------------------------

			const objLoader = new OBJLoader();
			const mtlLoader = new MTLLoader();

			const materials = await mtlLoader.loadAsync(
				'assets/rubik.mtl'
			);

			materials.preload();

			objLoader.setMaterials(materials);

			model = await objLoader.loadAsync(
				'assets/rubik.obj'
			);


			// --------------------------------
			// LIGHTING
			// --------------------------------

			const hemisphereLight = new THREE.HemisphereLight(
				0xffffff,
				0x888888,
				2.0
			);
			scene.add(hemisphereLight);

			const ambientLight = new THREE.AmbientLight(
				0xffffff,
				1.2
			);
			scene.add(ambientLight);

			const directionalLight = new THREE.DirectionalLight(
				0xffffff,
				3.0
			);

			directionalLight.position.set(1, 2, 1);
			directionalLight.target.position.set(0, 0, -0.65);

			scene.add(directionalLight);
			scene.add(directionalLight.target);



			// --------------------------------
			// REDUCE OBJECT SIZE
			// --------------------------------

			const box = new THREE.Box3().setFromObject(model);

			const size = new THREE.Vector3();
			const center = new THREE.Vector3();

			box.getSize(size);
			box.getCenter(center);

			// Desired maximum dimension: 12 cm
			const targetSize = 0.12;

			const maxDimension = Math.max(
				size.x,
				size.y,
				size.z
			);

			const scaleFactor = targetSize / maxDimension;

			model.scale.setScalar(scaleFactor);

			// Center the model
			model.position.set(
				-center.x * scaleFactor,
				-center.y * scaleFactor,
				-center.z * scaleFactor
			);

			// Position in front of the camera
			model.position.z -= 0.65;

			scene.add(model);

			// --------------------------------
			// RESIZE
			// --------------------------------

			window.addEventListener('resize', onWindowResize);

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(
				window.innerWidth,
				window.innerHeight
			);

		}

		// --------------------------------
		// ANIMATION
		// --------------------------------

		function animate() {

			const delta = clock.getDelta();

			if (model) {

				model.rotation.y += delta * 0.4;

			}

			renderer.render(scene, camera);

		}


	</script>
</body>

</html>
